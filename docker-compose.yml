# Challenge / lab stack mirroring render.yaml.
# Public: edge (:80) and dashboards (:5601) — restrict both in the Security Group
# (participant IP /32). OpenSearch and collector stay on loopback.
# Dashboards auth is off (AUTH_DISABLED_LOCAL_ONLY); do not open 5601 to 0.0.0.0/0.
name: soc

x-ingest-env: &ingest-env
  COLLECTOR_USERNAME: ingest
  COLLECTOR_PASSWORD: ${COLLECTOR_PASSWORD:-local-dev-only}

services:
  opensearch:
    build: ./services/opensearch
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      SOC_RETENTION_DAYS: "3"
    volumes:
      - opensearch-data:/var/lib/opensearch
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 30

  collector:
    build: ./services/collector
    environment:
      <<: *ingest-env
      OPENSEARCH_HOSTPORT: opensearch:9200
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      opensearch:
        condition: service_healthy

  # Proxies to the Mesa Norte lab API (offensive-seg-challange-api on Render).
  # Override BACKEND / PROXY_HOST_HEADER in .env if the upstream URL changes.
  edge:
    build: ./services/edge
    environment:
      <<: *ingest-env
      COLLECTOR_HOSTPORT: collector:8080
      BACKEND: ${BACKEND:-https://offensive-seg-challange-api.onrender.com}
      PROXY_HOST_HEADER: ${PROXY_HOST_HEADER:-offensive-seg-challange-api.onrender.com}
    ports:
      - "80:8080"
    depends_on:
      - collector

  dashboards:
    build: ./services/dashboards
    environment:
      OPENSEARCH_HOSTPORT: opensearch:9200
      AUTH_DISABLED_LOCAL_ONLY: "true"
    ports:
      - "5601:10000"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
