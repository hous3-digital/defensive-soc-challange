[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; nginx stdout carries the JSON access log and the ModSecurity audit log.
; supervisord rotates it and Vector tails the file (including rotated copies).
[program:nginx]
command=/docker-entrypoint.sh nginx -g "daemon off;"
priority=10
autorestart=true
startsecs=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/var/log/edge/nginx.stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vector]
command=/usr/local/bin/vector --config /etc/vector/vector.yaml
priority=20
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:exit-on-fatal]
command=/usr/local/bin/supervisord-exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
